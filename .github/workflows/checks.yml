name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run synthetic checks and frozen-export verification
        run: python3 -I scripts/check.py

  incident-metadata:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out proposed files as data
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: proposed
          persist-credentials: false
      - name: Check out trusted validator from the PR base
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Validate submission metadata without executing proposed code
        run: |
          if [ -f trusted/scripts/incidents/validate.py ]; then
            python3 -I trusted/scripts/incidents/validate.py --root proposed/incidents/submissions
          else
            echo 'Bootstrap PR: the base branch has no validator yet. Maintainer review is required.'
          fi
          if [ -f proposed/incidents/discovery/leads.jsonl ] && [ -f trusted/scripts/incidents/collect.py ]; then
            python3 -I trusted/scripts/incidents/collect.py --validate-cache proposed/incidents/discovery/leads.jsonl
          fi

  public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install pinned docs toolchain without lifecycle scripts
        run: npm ci --prefix docs --ignore-scripts --no-fund
      - name: Audit docs dependencies
        run: npm audit --prefix docs
      - name: Build and validate public output without publishing
        run: node scripts/site/build.mjs
