name: Incident discovery

on:
  schedule:
    # Daily at 09:17 Malaysia time (01:17 UTC).
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: incident-discovery
  cancel-in-progress: false

jobs:
  discovery:
    # Secret-bearing collection only runs trusted code on the default branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Only trusted default-branch code runs. Publication is limited to
          # allowlisted discovery metadata, never downloaded source or code.
          persist-credentials: true
      - name: Preserve unmerged discovery leads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incidents/discovery
          if git ls-remote --exit-code --heads origin refs/heads/codex/incident-discovery > /tmp/hindsight-bot-ref; then
            git fetch --no-tags origin refs/heads/codex/incident-discovery:refs/remotes/origin/codex/incident-discovery
            git show refs/remotes/origin/codex/incident-discovery:incidents/discovery/leads.jsonl > /tmp/hindsight-previous-leads.jsonl
            python3 -I scripts/incidents/merge_queue.py --previous /tmp/hindsight-previous-leads.jsonl
          else
            result=$?
            if [ "$result" -ne 2 ]; then exit "$result"; fi
          fi
      - name: Collect free RSS discovery signals
        id: rss
        continue-on-error: true
        run: >-
          python3 -I scripts/incidents/collect.py --execute
          --source google-news-ethereum --source openzeppelin
          --out incidents/discovery/leads.jsonl
          --status-out incidents/discovery/status.json
          --max-items 30 --days 14
      - name: Collect SerpAPI news and indexed public links when enabled
        id: serpapi
        if: vars.ENABLE_SERPAPI_DISCOVERY == 'true'
        continue-on-error: true
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: >-
          python3 -I scripts/incidents/collect.py --execute
          --source serpapi-news --source serpapi-x-links
          --out incidents/discovery/leads.jsonl
          --status-out incidents/discovery/serpapi-status.json
          --max-items 10 --days 7
      - name: Write source health summary
        if: always()
        env:
          ENABLE_SERPAPI_DISCOVERY: ${{ vars.ENABLE_SERPAPI_DISCOVERY }}
        run: |
          flags=()
          if [ "$ENABLE_SERPAPI_DISCOVERY" = true ]; then flags+=(--include-serpapi); fi
          python3 -I scripts/incidents/health.py --root incidents/discovery --github-summary "${flags[@]}"
      - name: Validate the proposed discovery cache offline
        id: cache
        if: always()
        run: python3 -I scripts/incidents/collect.py --validate-cache incidents/discovery/leads.jsonl
      - name: Refresh DeFiHackLabs catalog and compile Gemini proposals
        id: catalog
        if: always() && steps.cache.outcome == 'success'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          python3 -I scripts/incidents/catalog.py --execute --gemini --write-public
          python3 -I scripts/site/research_preview.py --write
      - name: Run trusted offline checks on the generated update
        id: checks
        if: always() && steps.cache.outcome == 'success'
        run: python3 -I scripts/check.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: always() && steps.checks.outcome == 'success'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Build and verify updated charts and documentation
        id: site
        if: always() && steps.checks.outcome == 'success'
        run: |
          npm ci --prefix docs --ignore-scripts --no-fund
          node scripts/site/build.mjs
      - name: Select existing discovery files for publication
        id: publication
        if: always() && steps.cache.outcome == 'success' && steps.checks.outcome == 'success' && steps.site.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo 'paths<<HINDSIGHT_FILES' >> "$GITHUB_OUTPUT"
          for file in incidents/discovery/leads.jsonl incidents/discovery/status.json incidents/discovery/serper-status.json incidents/discovery/serpapi-status.json incidents/discovery/ai-summaries.json datasets/catalog/current.json website/data/catalog.json website/data/research-preview.json website/index.html; do
            if [ -f "$file" ] && [ ! -L "$file" ]; then
              echo "$file" >> "$GITHUB_OUTPUT"
            fi
          done
          echo 'HINDSIGHT_FILES' >> "$GITHUB_OUTPUT"
      - name: Save discovery metadata automatically
        if: always() && steps.publication.outcome == 'success'
        shell: bash
        env:
          DISCOVERY_PATHS: ${{ steps.publication.outputs.paths }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            case "$file" in
              incidents/discovery/leads.jsonl|incidents/discovery/status.json|incidents/discovery/serper-status.json|incidents/discovery/serpapi-status.json|incidents/discovery/ai-summaries.json|datasets/catalog/current.json|website/data/catalog.json|website/data/research-preview.json|website/index.html)
                git add -- "$file" ;;
              *) echo 'Unexpected discovery publication path' >&2; exit 1 ;;
            esac
          done <<< "$DISCOVERY_PATHS"
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'data: ingest daily unverified incident reports'
          # Never force-push over a concurrent maintainer change. The next run
          # recollects the rolling window if a non-fast-forward push fails.
          git push origin "HEAD:$DEFAULT_BRANCH"
      - name: Deploy public site when Cloudflare is configured
        if: steps.site.outcome == 'success' && steps.catalog.outcome == 'success' && steps.rss.outcome == 'success' && steps.serpapi.outcome != 'failure' && vars.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4.153.0 pages deploy site-dist --project-name hindsight-solidity --branch main
      - name: Surface incomplete collection
        if: steps.rss.outcome == 'failure' || steps.serpapi.outcome == 'failure' || steps.catalog.outcome == 'failure'
        run: |
          echo 'A source or catalog refresh failed. Successful metadata was preserved; inspect the source status and AI attempt metadata.' >&2
          exit 1
